<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mapa de Rutas</title>
  
  <!-- Estilos de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; }
    #map { height: 100%; width: 100%; z-index: 1; }
    
    /* Panel Flotante para Direcciones y Botón */
    .control-panel {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-panel input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn-buscar {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-chofer {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      display: none; /* Se activa cuando la ruta está trazada */
    }
  </style>
</head>
<body>

  <!-- Panel de control sobre el mapa -->
  <div class="control-panel">
    <input type="text" id="origen" placeholder="Dirección de origen..." />
    <input type="text" id="destino" placeholder="Dirección de destino..." />
    <button class="btn-buscar" onclick="trazarRuta()">Trazar Ruta</button>
    <button class="btn-chofer" id="btnChofer" onclick="pedirChofer()">Pedir Chofer</button>
  </div>

  <!-- Contenedor del Mapa -->
  <div id="map"></div>

  <!-- Scripts de Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inicializar Mapa centrado por defecto
    const map = L.map('map').setView([-33.0472, -71.6127], 13);

    // Capa de mapa OSM gratuita
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let origenCoords = null;
    let destinoCoords = null;
    let routeLayer = null;
    let origenMarker = null;
    let destinoMarker = null;

    // Función para buscar coordenadas de un texto usando Nominatim
    async function obtenerCoordenadas(direccion) {
      const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(direccion)}`);
      const data = await response.json();
      if (data && data.length > 0) {
        return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), nombre: data[0].display_name };
      }
      return null;
    }

    // Dibujar la ruta entre origen y destino con OSRM
    async function trazarRuta() {
      const textoOrigen = document.getElementById('origen').value;
      const textoDestino = document.getElementById('destino').value;

      if (!textoOrigen || !textoDestino) {
        alert("Por favor ingresa origen y destino");
        return;
      }

      origenCoords = await obtenerCoordenadas(textoOrigen);
      destinoCoords = await obtenerCoordenadas(textoDestino);

      if (!origenCoords || !destinoCoords) {
        alert("No se pudieron encontrar las direcciones. Intenta ser más específico.");
        return;
      }

      // Limpiar capas anteriores
      if (routeLayer) map.removeLayer(routeLayer);
      if (origenMarker) map.removeLayer(origenMarker);
      if (destinoMarker) map.removeLayer(destinoMarker);

      // Crear marcadores
      origenMarker = L.marker([origenCoords.lat, origenCoords.lng]).addTo(map).bindPopup("Origen").openPopup();
      destinoMarker = L.marker([destinoCoords.lat, destinoCoords.lng]).addTo(map).bindPopup("Destino");

      // Consultar ruta a OSRM
      const urlOSRM = `https://router.project-osrm.org/route/v1/driving/${origenCoords.lng},${origenCoords.lat};${destinoCoords.lng},${destinoCoords.lat}?overview=full&geometries=geojson`;
      
      const res = await fetch(urlOSRM);
      const data = await res.json();

      if (data.routes && data.routes.length > 0) {
        const routeGeometry = data.routes[0].geometry;
        
        // Dibujar línea de la ruta
        routeLayer = L.geoJSON(routeGeometry, {
          style: { color: '#007bff', weight: 5, opacity: 0.8 }
        }).addTo(map);

        // Ajustar la vista del mapa a la ruta trazada
        map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

        // Mostrar el botón de Pedir Chofer
        document.getElementById('btnChofer').style.display = 'block';
      }
    }

    // Enviar los datos a Apphive mediante postMessage
    function pedirChofer() {
      if (!origenCoords || !destinoCoords) return;

      const datosViaje = {
        evento: "pedir_chofer",
        origen: origenCoords,
        destino: destinoCoords
      };

      // Enviar el objeto a la aplicación contenedora (Apphive)
      if (window.parent) {
        window.parent.postMessage(JSON.stringify(datosViaje), "*");
      }
    }
  </script>
</body>
</html>
